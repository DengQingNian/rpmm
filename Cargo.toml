[package]
name = "rpmm"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
default-run = "rpmm"

[workspace]
members = ["src-tauri"]
resolver = "3"

[features]
test-fixtures = []

[[bin]]
name = "rpmm-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixtures"]
test = false
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
