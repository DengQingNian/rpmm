[package]
name = "rpmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
test-fixtures = []

[[bin]]
name = "rpmm-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixtures"]
test = false
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "7"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell"] }
